<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC WMS & TMS Integrado - Sistema de Gerenciamento</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF para exportação em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans antialiased">

    <!-- Cabeçalho -->
    <header class="bg-dark-800 border-b border-dark-700 px-6 py-4 flex flex-col sm:flex-row items-center justify-between shadow-md gap-4">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2.5 rounded-lg text-white">
                <i class="fa-solid fa-boxes-stacked text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide">RC WMS & TMS Integrado</h1>
                <p class="text-xs text-slate-400">Armazém, Frotas, Relatórios e Rotas</p>
            </div>
        </div>
        
        <!-- Navegação por Abas -->
        <div class="flex space-x-2 bg-dark-900 p-1.5 rounded-xl border border-dark-700">
            <button onclick="mudarAba('wms')" id="btn-tab-wms" class="px-4 py-2 rounded-lg text-xs font-semibold transition bg-blue-600 text-white cursor-pointer shadow">
                <i class="fa-solid fa-warehouse mr-1.5"></i> Armazém & WMS
            </button>
            <button onclick="mudarAba('frotas')" id="btn-tab-frotas" class="px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-white cursor-pointer">
                <i class="fa-solid fa-truck-fast mr-1.5"></i> Frotas & TMS (Maps)
            </button>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="gerarPDF()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer" title="Exportar Relatório PDF">
                <i class="fa-solid fa-file-pdf"></i> PDF
            </button>
            <button onclick="compartilharWhatsApp()" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer" title="Enviar Relatório via WhatsApp">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6 overflow-y-auto space-y-6">
        <div class="max-w-7xl mx-auto space-y-6">

            <!-- ================= ABA 1: WMS / ARMAZÉM ================= -->
            <div id="secao-wms" class="space-y-6">
                <!-- Cards de Indicadores (KPIs) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-lg flex items-center justify-between">
                        <div>
                            <p class="text-xs text-slate-400 uppercase font-semibold">Total de SKUs</p>
                            <h3 id="kpi-skus" class="text-2xl font-bold mt-1 text-white">0</h3>
                        </div>
                        <div class="bg-blue-500/10 text-blue-400 p-3 rounded-lg"><i class="fa-solid fa-box text-xl"></i></div>
                    </div>
                    <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-lg flex items-center justify-between">
                        <div>
                            <p class="text-xs text-slate-400 uppercase font-semibold">Itens em Estoque</p>
                            <h3 id="kpi-estoque" class="text-2xl font-bold mt-1 text-white">0</h3>
                        </div>
                        <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-lg"><i class="fa-solid fa-cubes text-xl"></i></div>
                    </div>
                    <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-lg flex items-center justify-between">
                        <div>
                            <p class="text-xs text-slate-400 uppercase font-semibold">Endereços Ocupados</p>
                            <h3 id="kpi-enderecos" class="text-2xl font-bold mt-1 text-white">0</h3>
                        </div>
                        <div class="bg-amber-500/10 text-amber-400 p-3 rounded-lg"><i class="fa-solid fa-warehouse text-xl"></i></div>
                    </div>
                </div>

                <!-- Grid de Ações: Recebimento
